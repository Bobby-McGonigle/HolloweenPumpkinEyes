<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#a94b15">
  <title>Halloween Pumpkin with Moving Eyes</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #0c0e0c; color: #f3dec0; }
    .scene { position: relative; width: 100%; height: 100%; isolation: isolate; background: #a94b15; }
    .pumpkin-surface { position: absolute; width: 100%; height: 100%; inset: 0; }
    .pumpkin-face { position: absolute; width: 96%; height: 88%; left: 2%; top: 10%; overflow: visible; }
    .scrolling-message { position: absolute; z-index: 2; top: 5%; left: 50%; width: 94%; max-width: 1100px; margin: 0; transform: translateX(-50%); text-align: center; overflow-wrap: anywhere; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(28px, 5vw, 66px); font-weight: normal; letter-spacing: .13em; color: #e9d8b9; text-shadow: 0 2px 12px #000, 0 0 30px #d5843833; animation: greeting-fade 14s ease-in-out infinite; }
    .scrolling-message[data-text-style="marquee"] { left: 100%; width: max-content; max-width: none; white-space: nowrap; overflow-wrap: normal; text-align: left; animation: scroll 28s linear infinite; }
    @keyframes greeting-fade { 0%, 100% { opacity: .35; } 30%, 70% { opacity: 1; } }
    @keyframes scroll { from { transform: translateX(calc(-100vw - 100%)); } to { transform: translateX(0); } }
    .firelight { mix-blend-mode: screen; opacity: .85; transition: opacity 700ms ease-in-out; }
    .ember { opacity: var(--eye-visibility, 1); filter: url(#pupil-glow); transition: transform 240ms ease-out; }
    .eyebrow { transform-box: view-box; transition: transform 900ms cubic-bezier(.4, 0, .2, 1); }
    .pumpkin-surface, .eyebrow, .eyelid, .ambient-detail { filter: brightness(var(--outside-light, 1)); }
    .cut-wall { filter: brightness(var(--shell-light, 1)); }
    .teal-reflection { opacity: var(--eye-visibility, 1); mix-blend-mode: screen; }
    .eyelid { transition: transform 600ms ease-in-out; transform: translateY(-100px); }
    .eyebrow-left { transform-origin: 420px 410px; }
    .eyebrow-right { transform-origin: 780px 410px; }
    @media (prefers-reduced-motion: reduce) { .firelight, .scrolling-message { animation: none; } .scrolling-message, .scrolling-message[data-text-style="marquee"] { animation: none; opacity: 1; left: 50%; width: 94%; transform: translateX(-50%); max-width: 1100px; white-space: normal; overflow-wrap: anywhere; text-align: center; letter-spacing: .05em; } .ember, .firelight, .eyebrow, .eyelid { transition: none; } }
  </style>
</head>

  <script>
    const message = document.querySelector('.scrolling-message');
    const defaultMessage = message.textContent;
    function updateScrollDuration() {
      message.style.animationDuration = message.dataset.textStyle === 'marquee'
        ? `${(window.innerWidth + message.offsetWidth) / 55}s`
        : '14s';
    }
    function applyHashParameters() {
      const params = new URLSearchParams(window.location.hash.slice(1));
      message.dataset.textStyle = params.get('textStyle') === 'marquee' ? 'marquee' : 'fade';
      message.hidden = params.get('showText') === 'false';
      message.textContent = params.get('modTextContent') || defaultMessage;
      const fontSize = Number.parseInt(params.get('modFontSize'), 10);
      message.style.fontSize = Number.isFinite(fontSize) && fontSize > 0
        ? `${Math.min(fontSize, 300)}px`
        : '';
      updateScrollDuration();
    }
    applyHashParameters();
    window.addEventListener('hashchange', applyHashParameters);
    window.addEventListener('resize', updateScrollDuration);
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const embers = document.querySelectorAll('.ember');
    const brows = document.querySelectorAll('.eyebrow');
    const lids = document.querySelectorAll('.eyelid');
    const lights = document.querySelectorAll('.firelight');
    const scene = document.querySelector('.scene');
    const source = document.querySelector('#cavity');
    const spills = [document.querySelector('#spill-left'), document.querySelector('#spill-right')];
    const random = (min, max) => min + Math.random() * (max - min);
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const smooth = value => value * value * (3 - 2 * value);
    const pointer = { x: 0, y: 0, until: 0 };
    const gaze = { x: 0, y: 0, targetX: 0, targetY: 0, next: 0, trackingUntil: 0 };
    const flame = { from: .85, to: .85, start: 0, duration: 900, next: 0 };
    let nextBrow = 1200;
    let nextSquint = random(7000, 14000);
    let squintUntil = 0;
    let nextBlackout = random(45000, 90000);
    let blackoutStart = 0;
    let blackoutHold = 0;
    let blackoutKind = 'inside';
    let nextBlackoutKind = Math.random() < .5 ? 'inside' : 'outside';
    let frameId = 0;
    let lastFrame = 0;
    let elapsed = 0;
    let motionElapsed = 0;
    let brightness = .85;
    let motionPaused = false;
    let pausedTransforms = [];

    function pauseMotion(paused) {
      if (paused === motionPaused) return;
      motionPaused = paused;
      message.style.animationPlayState = paused ? 'paused' : 'running';
      const movingParts = [...brows, ...lids];
      if (paused) {
        pausedTransforms = movingParts.map(part => part.style.transform);
        movingParts.forEach(part => {
          const transform = window.getComputedStyle(part).transform;
          part.style.transition = 'none';
          part.style.transform = transform;
        });
      } else {
        movingParts.forEach((part, index) => {
          part.style.transition = '';
          part.style.transform = pausedTransforms[index];
        });
      }
    }

    window.addEventListener('pointermove', event => {
      if (event.pointerType === 'touch') return;
      pointer.x = clamp((event.clientX / window.innerWidth - .5) * 36, -18, 18);
      pointer.y = clamp((event.clientY / window.innerHeight - .5) * 10, -5, 5);
      if (motionPaused || reducedMotion.matches) return;
      pointer.until = motionElapsed + 5000;
    }, { passive: true });
    document.addEventListener('pointerleave', () => pointer.until = 0);

    function setBrows(squint = false) {
      const furrow = squint ? 9 : random(2, 7);
      const raised = !squint && Math.random() < .3;
      brows.forEach((brow, index) => {
        brow.style.transform = `translateY(${squint ? 5 : raised && index === 0 ? -6 : 1}px) rotate(${index === 0 ? raised ? -4 : furrow : -furrow}deg)`;
      });
    }

    function resetAnimation() {
      pauseMotion(false);
      embers.forEach(eye => eye.style.transform = 'translate(0, 0)');
      brows.forEach(brow => brow.style.transform = 'none');
      lids.forEach(lid => lid.style.transform = 'translateY(-100px)');
      lights.forEach(light => light.style.opacity = .85);
      scene.style.setProperty('--shell-light', '1');
      scene.style.setProperty('--eye-visibility', '1');
      scene.style.setProperty('--outside-light', '1');
      source.setAttribute('cx', '600');
      source.setAttribute('cy', '780');
      spills.forEach((spill, i) => {
        spill.setAttribute('cx', i === 0 ? '420' : '780');
        spill.setAttribute('cy', '477');
      });
      gaze.x = gaze.y = gaze.targetX = gaze.targetY = 0;
      pointer.until = 0;
      gaze.trackingUntil = 0;
      squintUntil = blackoutStart = 0;
      nextBlackoutKind = Math.random() < .5 ? 'inside' : 'outside';
      nextSquint = motionElapsed + random(7000, 14000);
      nextBlackout = elapsed + random(45000, 90000);
    }

    function animate(now) {
      if (reducedMotion.matches || document.hidden) { frameId = 0; return; }
      frameId = window.requestAnimationFrame(animate);
      if (lastFrame && now - lastFrame < 32) return;
      const dt = lastFrame ? Math.min(now - lastFrame, 100) : 33;
      lastFrame = now;
      elapsed += dt;
      if (!blackoutStart && elapsed >= nextBlackout) {
        blackoutStart = elapsed;
        blackoutKind = nextBlackoutKind;
        blackoutHold = random(4000, 7000);
      }
      let warmth = 1;
      let eyeVisibility = 1;
      let outsideLight = 1;
      if (blackoutStart) {
        const age = elapsed - blackoutStart;
        let visibility;
        if (age < 1600) visibility = 1 - smooth(age / 1600);
        else if (age < 1600 + blackoutHold) visibility = 0;
        else visibility = smooth(clamp((age - 1600 - blackoutHold) / 2800, 0, 1));
        // Only one illumination channel can black out at a time.
        if (blackoutKind === 'inside') {
          warmth = eyeVisibility = visibility;
        } else {
          outsideLight = visibility;
        }
        if (age >= 4400 + blackoutHold) {
          blackoutStart = 0;
          nextBlackoutKind = blackoutKind === 'inside' ? 'outside' : 'inside';
          nextBlackout = elapsed + random(45000, 90000);
        }
      }
      // Keep the blackout fade running while all other animation clocks are frozen.
      const frozen = Boolean(blackoutStart && blackoutKind === 'inside');
      pauseMotion(frozen);
      if (!frozen) motionElapsed += dt;
      const t = motionElapsed;
      if (!frozen) {

      if (t >= gaze.next) {
        const stare = Math.random() < .3;
        gaze.trackingUntil = pointer.until > t && Math.random() < .55 ? t + random(1600, 3200) : 0;
        gaze.targetX = random(-17, 17);
        gaze.targetY = random(-4, 4);
        gaze.next = t + (stare ? random(2600, 4800) : random(650, 1500));
      }
      const tracking = t < gaze.trackingUntil && t < pointer.until;
      const blend = 1 - Math.exp(-dt / (tracking ? 150 : 85));
      gaze.x += ((tracking ? pointer.x : gaze.targetX) - gaze.x) * blend;
      gaze.y += ((tracking ? pointer.y : gaze.targetY) - gaze.y) * blend;
      embers.forEach(eye => {
        eye.style.transition = 'none';
        eye.style.transform = `translate(${gaze.x}px, ${gaze.y}px)`;
      });
      spills.forEach((spill, i) => {
        spill.setAttribute('cx', (i === 0 ? 420 : 780) + gaze.x);
        spill.setAttribute('cy', 477 + gaze.y);
      });

      if (t >= nextSquint && !squintUntil) {
        squintUntil = t + random(1600, 2600);
        lids.forEach(lid => lid.style.transform = 'translateY(13px)');
        setBrows(true);
      }
      if (squintUntil && t >= squintUntil) {
        squintUntil = 0;
        lids.forEach(lid => lid.style.transform = 'translateY(-100px)');
        setBrows();
        nextSquint = t + random(10000, 22000);
        nextBrow = t + 2500;
      }
      if (!squintUntil && t >= nextBrow) {
        setBrows();
        nextBrow = t + random(2600, 5800);
      }

      const progress = clamp((t - flame.start) / flame.duration, 0, 1);
      brightness = flame.from + (flame.to - flame.from) * smooth(progress);
      if (t >= flame.next) {
        flame.from = brightness;
        flame.to = Math.random() < .18 ? random(.48, .66) : random(.72, 1);
        flame.start = t;
        flame.duration = Math.random() < .12 ? random(160, 340) : random(500, 1400);
        flame.next = t + flame.duration + random(200, 1700);
      }
      }
      lights.forEach(light => {
        light.style.transition = 'none';
        light.style.opacity = brightness * warmth;
      });
      scene.style.setProperty('--shell-light', .2 * outsideLight + .8 * warmth);
      scene.style.setProperty('--outside-light', outsideLight);
      scene.style.setProperty('--eye-visibility', eyeVisibility);
      // Both axes drift subtly, but the hidden source stays below the teeth.
      if (!frozen) {
        source.setAttribute('cx', 600 + Math.sin(t / 3700) * 10 + Math.sin(t / 7100) * 5);
        source.setAttribute('cy', 780 + Math.sin(t / 4900) * 5);
      }
    }

    function syncAnimation() {
      window.cancelAnimationFrame(frameId);
      lastFrame = 0;
      if (reducedMotion.matches) resetAnimation();
      if (!reducedMotion.matches && !document.hidden) frameId = window.requestAnimationFrame(animate);
    }
    reducedMotion.addEventListener('change', syncAnimation);
    document.addEventListener('visibilitychange', syncAnimation);
    resetAnimation();
    syncAnimation();
  </script>
</body>
</html>
